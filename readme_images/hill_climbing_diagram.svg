<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Deep Agents hill-climbing flowchart</title>
  <desc id="desc">Five requirement documents and AGENTS.md enter a review and grading loop. An analyst proposes one improvement. A person decides whether to test and adopt it. No or no gain leaves AGENTS.md unchanged.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; font-size: 16px; }
      .title { font-size: 18px; font-weight: 600; }
      .small { font-size: 14px; }
      .white { fill: #fff; font-weight: 600; }
      .center { text-anchor: middle; dominant-baseline: middle; }
      .edge { fill: none; stroke: #4b5563; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-label { paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
      .group { stroke-width: 2; rx: 12; }
      .node { stroke-width: 2; rx: 8; }
    </style>
  </defs>

  <rect width="1400" height="900" rx="16" fill="#fff"/>

  <!-- Start -->
  <rect x="600" y="20" width="200" height="48" rx="24" fill="#222" stroke="#ffcc00" stroke-width="4"/>
  <text x="700" y="45" class="center white"> START HERE</text>
  <path d="M700 68 V90" class="edge"/>

  <!-- Initial inputs -->
  <rect x="40" y="90" width="1320" height="120" class="group" fill="#fff4f4" stroke="#b85450"/>
  <text x="60" y="117" class="title">Initial inputs</text>

  <rect x="70" y="135" width="180" height="50" class="node" fill="#fde8e8" stroke="#b85450"/>
  <text x="160" y="161" class="center">Authentication</text>

  <rect x="280" y="135" width="180" height="50" class="node" fill="#fde8e8" stroke="#b85450"/>
  <text x="370" y="161" class="center">Notifications</text>

  <rect x="490" y="135" width="180" height="50" class="node" fill="#fde8e8" stroke="#b85450"/>
  <text x="580" y="161" class="center">Payment retries</text>

  <rect x="700" y="135" width="180" height="50" class="node" fill="#fde8e8" stroke="#b85450"/>
  <text x="790" y="161" class="center">Access control</text>

  <rect x="910" y="135" width="180" height="50" class="node" fill="#fde8e8" stroke="#b85450"/>
  <text x="1000" y="161" class="center">Alert escalation</text>

  <rect x="1120" y="135" width="200" height="50" rx="25" fill="#8b0000" stroke="#5c0000" stroke-width="2"/>
  <text x="1220" y="161" class="center white">AGENTS.md</text>

  <!-- Inputs to verification -->
  <path d="M700 210 V250" class="edge"/>
  <text x="718" y="233" class="small edge-label">run batch</text>

  <!-- Verification loop -->
  <rect x="140" y="250" width="1120" height="130" class="group" fill="#eef6ff" stroke="#5b8fc9"/>
  <text x="160" y="278" class="title">Step 1  -  Run and grade each requirement</text>

  <rect x="220" y="300" width="220" height="58" class="node" fill="#0b4a8b" stroke="#06305c"/>
  <text x="330" y="321" class="center white">
    <tspan x="330" dy="0">Review agent</tspan>
    <tspan x="330" dy="20">writes analysis.md</tspan>
  </text>

  <rect x="590" y="300" width="220" height="58" class="node" fill="#2e6b1f" stroke="#1d4713"/>
  <text x="700" y="321" class="center white">
    <tspan x="700" dy="0">Grader</tspan>
    <tspan x="700" dy="20">3 criteria</tspan>
  </text>

  <rect x="960" y="300" width="220" height="58" rx="29" fill="#eef2f7" stroke="#7a8899" stroke-width="2"/>
  <text x="1070" y="321" class="center">
    <tspan x="1070" dy="0">Run history</tspan>
    <tspan x="1070" dy="20">first-draft scores</tspan>
  </text>

  <path d="M440 329 H590" class="edge"/>
  <path d="M810 329 H960" class="edge"/>
  <text x="880" y="316" class="small edge-label">pass</text>
  <path d="M700 358 V370 H330 V358" class="edge"/>
  <text x="500" y="367" class="small edge-label">revise up to 3</text>

  <!-- History to learning -->
  <path d="M1070 358 V400 H225 V468" class="edge"/>
  <text x="610" y="397" class="small edge-label">recurring failure</text>

  <!-- Learning -->
  <rect x="70" y="420" width="1260" height="150" class="group" fill="#fff6ed" stroke="#b35900"/>
  <text x="90" y="448" class="title">Steps 2-3  -  Find and approve one improvement</text>

  <rect x="120" y="468" width="210" height="58" class="node" fill="#eef2f7" stroke="#7a8899"/>
  <text x="225" y="489" class="center">
    <tspan x="225" dy="0">Example failure</tspan>
    <tspan x="225" dy="20">clarity + depth: 0/5</tspan>
  </text>

  <rect x="390" y="468" width="210" height="58" class="node" fill="#b35900" stroke="#7a3d00"/>
  <text x="495" y="489" class="center white">
    <tspan x="495" dy="0">Step 2  -  Analyst</tspan>
    <tspan x="495" dy="20">reads one batch</tspan>
  </text>

  <rect x="660" y="468" width="180" height="58" class="node" fill="#eef2f7" stroke="#7a8899"/>
  <text x="750" y="489" class="center">
    <tspan x="750" dy="0">One change</tspan>
    <tspan x="750" dy="20">with evidence</tspan>
  </text>

  <polygon points="880,497 980,457 1080,497 980,537" fill="#fff3b0" stroke="#c9a400" stroke-width="2"/>
  <text x="980" y="488" class="center">
    <tspan x="980" dy="0">Step 3  -  Apply</tspan>
    <tspan x="980" dy="20">the change?</tspan>
  </text>

  <path d="M330 497 H390" class="edge"/>
  <path d="M600 497 H660" class="edge"/>
  <path d="M840 497 H880" class="edge"/>

  <!-- Testing -->
  <rect x="70" y="610" width="1260" height="150" class="group" fill="#f5f7fa" stroke="#7a8899"/>
  <text x="90" y="638" class="title">Steps 4-6  -  Test and adopt the approved change</text>

  <rect x="880" y="658" width="200" height="58" class="node" fill="#eef2f7" stroke="#7a8899"/>
  <text x="980" y="679" class="center">
    <tspan x="980" dy="0">Update a copy</tspan>
    <tspan x="980" dy="20">of AGENTS.md</tspan>
  </text>

  <rect x="620" y="658" width="200" height="58" class="node" fill="#eef2f7" stroke="#7a8899"/>
  <text x="720" y="679" class="center">
    <tspan x="720" dy="0">Step 4  -  Re-run</tspan>
    <tspan x="720" dy="20">same 5 requirements</tspan>
  </text>

  <rect x="360" y="658" width="200" height="58" class="node" fill="#eef2f7" stroke="#7a8899"/>
  <text x="460" y="679" class="center">
    <tspan x="460" dy="0">Step 5  -  Compare</tspan>
    <tspan x="460" dy="20">before vs after</tspan>
  </text>

  <polygon points="110,687 200,647 290,687 200,727" fill="#fff3b0" stroke="#c9a400" stroke-width="2"/>
  <text x="200" y="678" class="center">
    <tspan x="200" dy="0">Step 6  -  Make it</tspan>
    <tspan x="200" dy="20">the baseline?</tspan>
  </text>

  <!-- Direct Yes from Step 3 -->
  <path d="M980 537 V658" class="edge"/>
  <text x="991" y="590" class="small edge-label">Yes</text>

  <!-- Direct No from Step 3 -->
  <path d="M1080 497 H1360 V800 H750 V820" class="edge"/>
  <text x="1100" y="487" class="small edge-label">No</text>

  <!-- Test flow, right to left -->
  <path d="M880 687 H820" class="edge"/>
  <path d="M620 687 H560" class="edge"/>
  <path d="M360 687 H290" class="edge"/>
  <text x="310" y="674" class="small edge-label">Better</text>

  <!-- Direct No gain from Step 5 -->
  <path d="M460 716 V790 H650 V820" class="edge"/>
  <text x="475" y="748" class="small edge-label">No gain</text>

  <!-- Direct Yes from Step 6 to next cycle -->
  <path d="M110 687 H25 V225 H40" class="edge"/>
  <text x="40" y="595" class="small edge-label">Yes: next cycle</text>

  <!-- Direct No from Step 6 -->
  <path d="M200 727 V800 H700 V820" class="edge"/>
  <text x="215" y="760" class="small edge-label">No</text>

  <!-- Shared unchanged outcome -->
  <rect x="600" y="820" width="200" height="58" rx="29" fill="#eef2f7" stroke="#7a8899" stroke-width="2"/>
  <text x="700" y="841" class="center">
    <tspan x="700" dy="0">End cycle</tspan>
    <tspan x="700" dy="20">AGENTS.md unchanged</tspan>
  </text>
</svg>
